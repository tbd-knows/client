<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Join TBD</title>
  </head>
  <body>
    <main>
      <p class="brand">TBD</p>
      <h1>Join TBD</h1>
      <p id="status" role="status" aria-live="polite">Loading your invitation…</p>
      <button id="join" type="button" hidden>Join TBD</button>
      <noscript>Enable JavaScript to join. If your link has expired, ask the founder to resend it.</noscript>
    </main>
    <script type="module">
      // Scrub before loading the application or making any Auth/API request.
      let fragment = window.location.hash;
      history.replaceState(null, '', window.location.pathname);
      import('/src/main.ts').then(({ mount }) => {
        mount(fragment);
        fragment = '';
      });
    </script>
  </body>
</html>
